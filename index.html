<!doctype html>
<html lang="en">
  <head>
    <script src="/theme-init.js"></script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>মধুবন্ধন | Tangail Matrimony</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf6f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101319" />
    <meta name="description" content="মধুবন্ধন — টাঙ্গাইল জেলার বিশ্বস্ত বায়োডাটা প্ল্যাটফর্ম।" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="মধুবন্ধন" />
    <style>
      /* Branded preloader — shown until React mounts (removed by main.tsx).
         Theme-aware via the data-theme attribute set by theme-init.js. */
      #preloader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #faf6f8;
        transition: opacity .35s ease;
      }
      html[data-theme="dark"] #preloader { background: #101319; }
      #preloader .pl-logo {
        width: 56px; height: 56px; border-radius: 18px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #e11d48, #ec4899);
        box-shadow: 0 12px 30px -10px rgb(225 29 72 / .45);
        animation: pl-pulse 1.4s ease-in-out infinite;
      }
      html[data-theme="dark"] #preloader .pl-logo { background: linear-gradient(135deg, #fb5c7e, #ec4899); box-shadow: 0 12px 30px -10px rgb(251 92 126 / .4); }
      #preloader .pl-name { font-size: 20px; font-weight: 800; color: #2b161f; letter-spacing: .01em; }
      html[data-theme="dark"] #preloader .pl-name { color: #f2f4f8; }
      #preloader .pl-tag { font-size: 9px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: #836d78; }
      html[data-theme="dark"] #preloader .pl-tag { color: #8b95a5; }
      #preloader .pl-ring {
        width: 22px; height: 22px; border-radius: 999px;
        border: 2.5px solid rgb(225 29 72 / .18); border-top-color: #e11d48;
        animation: pl-spin .8s linear infinite;
      }
      html[data-theme="dark"] #preloader .pl-ring { border-color: rgb(251 92 126 / .2); border-top-color: #fb5c7e; }
      @keyframes pl-spin { to { transform: rotate(360deg); } }
      @keyframes pl-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
      html.mb-preloader-done #preloader, #preloader.mb-done { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="preloader" aria-hidden="true">
      <div class="pl-logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>
      <div class="pl-name">মধুবন্ধন</div>
      <div class="pl-tag">Tangail Matrimony</div>
      <div class="pl-ring"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
